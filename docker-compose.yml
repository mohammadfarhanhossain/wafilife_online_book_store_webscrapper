services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wafilife_db
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
